[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deltafuse"
version = "2.5.0"
description = "DeltaFuse Specification-Driven AI Engineering Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
deltafuse = "deltafuse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# DF3-005 / B-01: the immutable runtime bundle (schemas, templates, skills,
# manifest) ships inside the wheel so an installed CLI needs no source checkout.
[tool.setuptools.package-data]
"deltafuse.assets" = ["**/*.yaml", "**/*.yml", "**/*.md", "**/*.json", "**/*.py"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q --strict-markers"
