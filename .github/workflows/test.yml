name: DeltaFuse CI Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      # v5 runs on Node 24; v4 is force-migrated from deprecated Node 20.
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        # v6 runs on Node 24; keep the Python matrix independent from action runtime.
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] || pip install jsonschema pyyaml pytest

      - name: Run Test Suite
        run: |
          python -m pytest -v
