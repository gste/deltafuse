# Canonical halt object on `deltafuse next --json` (producer).
# Hosts (Cursor, IDE, orchestrator) pin this schema. Not a product artifact schema.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://deltafuse.dev/contracts/halt/v1
title: DeltaFuse next halt (host button contract)
description: >
  The `halt` property of `deltafuse next --json` when a Human Gate or empty
  queue stops through-mode. JSON null halt (ready Worker step) is not this
  schema. Unknown properties are allowed; hosts MUST ignore them.
type: object
additionalProperties: true
required: [kind, prompt, choices]
properties:
  kind:
    enum: [decision, spec, blocked, done]
    description: Why through-mode stopped. Hosts MUST NOT invent extra kinds.
  prompt:
    type: string
    minLength: 1
    description: Human-readable stop reason. Not a command. Do not execute it.
  choices:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/choice'
    description: Sole button list. Host MUST render every item and MUST NOT add merge/push.
  human_check:
    enum: [none, password]
    description: >
      Optional. On a decision or spec halt: `password` when the product guards the
      Human Gate with a password (`decide` then answers only in an interactive
      terminal), `none` when a click in the chat is enough.
  terminal_required:
    type: boolean
    description: >
      Optional, present as true with `human_check: password`. The host MUST NOT run
      `command` itself: show it to the human, who runs it in a terminal and types
      the password. The Worker never answers.
$defs:
  choice:
    type: object
    additionalProperties: true
    required: [id, label, command]
    properties:
      id:
        type: string
        minLength: 1
        description: Opaque choice key (e.g. accept:DEC-0001, inspect).
      label:
        type: string
        minLength: 1
        description: Button title. Host MUST display this string.
      interactive_only:
        type: boolean
        description: Optional. True when `command` needs a terminal (Human Gate password).
      command:
        description: >
          Shell to run from the product root after a human click.
          null means stop (inspect). A string MUST be a deltafuse decide invocation.
        type: [string, 'null']
    allOf:
      - if:
          properties:
            id: {const: inspect}
          required: [id]
        then:
          properties:
            command: {type: 'null'}
      - if:
          properties:
            command: {type: string}
          required: [command]
        then:
          properties:
            command:
              type: string
              pattern: '^deltafuse decide '
