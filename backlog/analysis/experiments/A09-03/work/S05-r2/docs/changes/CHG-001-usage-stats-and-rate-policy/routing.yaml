change: CHG-001-usage-stats-and-rate-policy
claims:
  CR-001:
    summary: >-
      New monitoring.usage_stats capability tracking per-key consume counts,
      success/denial counts, and peak 1-second load via get_stats(key).
    primary_capability: monitoring.usage_stats
    related_capabilities:
      - security.ratelimit
    confidence: medium
  CR-002:
    summary: >-
      New security.rate_policy that auto-blocks a key after a threshold of
      consecutive denied consumes, returning False without consuming tokens and
      exposing a blocked_until marker in stats.
    primary_capability: security.rate_policy
    related_capabilities:
      - security.ratelimit
      - monitoring.usage_stats
    confidence: medium
  CR-003:
    summary: >-
      Mutual compatibility constraint; stats must reflect denials from both token
      shortage and policy-based blocking.
    primary_capability: security.ratelimit
    related_capabilities:
      - monitoring.usage_stats
      - security.rate_policy
    confidence: medium
  CR-004:
    summary: >-
      Integration tests required to verify the interaction between usage stats and
      the rate policy auto-block.
    primary_capability: security.ratelimit
    related_capabilities:
      - monitoring.usage_stats
      - security.rate_policy
    confidence: medium
  CR-005:
    summary: >-
      Existing Rate Limiter behavior must be preserved except for intentionally
      changed paths.
    primary_capability: security.ratelimit
    confidence: high
