change: CHG-001-usage-stats-and-rate-policy
claims:
  CR-001:
    summary: Add a new usage_stats capability to the Rate Limiter product.
    primary_capability: monitoring.usage_stats
    related_capabilities:
      - security.ratelimit
    confidence: high
  CR-002:
    summary: Per-key tracking of total, successful, rejected consume calls and peak load.
    primary_capability: monitoring.usage_stats
    related_capabilities:
      - security.ratelimit
    confidence: high
  CR-003:
    summary: get_stats(key) returns a dict of the tracked values.
    primary_capability: monitoring.usage_stats
    related_capabilities:
      - security.ratelimit
    confidence: high
  CR-004:
    summary: rate_policy auto-blocks a key after exceeding a rejection threshold.
    primary_capability: security.rate_policy
    related_capabilities:
      - security.ratelimit
      - monitoring.usage_stats
    confidence: high
  CR-005:
    summary: Threshold example is 50 rejected consume calls; consecutive vs cumulative unspecified.
    primary_capability: security.rate_policy
    related_capabilities:
      - security.ratelimit
    confidence: low
  CR-006:
    summary: Default blocking period is 300 seconds and must be configurable.
    primary_capability: security.rate_policy
    related_capabilities:
      - security.ratelimit
    confidence: high
  CR-007:
    summary: A blocked key returns False from consume without consuming tokens.
    primary_capability: security.ratelimit
    related_capabilities:
      - security.rate_policy
    confidence: high
  CR-008:
    summary: Stats of a blocked key include a blocked_until label/marker.
    primary_capability: monitoring.usage_stats
    related_capabilities:
      - security.rate_policy
      - security.ratelimit
    confidence: high
  CR-009:
    summary: Stats must reflect rejections from both token shortage and policy blocking.
    primary_capability: monitoring.usage_stats
    related_capabilities:
      - security.rate_policy
      - security.ratelimit
    policies:
      - security.rate_policy
    confidence: high
  CR-010:
    summary: Integration tests verifying the interaction of both changes are required.
    primary_capability: security.ratelimit
    related_capabilities:
      - monitoring.usage_stats
      - security.rate_policy
    confidence: high
  CR-011:
    summary: Concrete implementation, existing API, storage model, and registration points are unknown.
    primary_capability: security.ratelimit
    related_capabilities:
      - monitoring.usage_stats
      - security.rate_policy
    confidence: unknown
  CR-012:
    summary: Peak load semantics (sliding window vs fixed bucket, resolution) unspecified.
    primary_capability: monitoring.usage_stats
    related_capabilities:
      - security.ratelimit
    confidence: low
  CR-013:
    summary: Rejection threshold semantics (consecutive vs cumulative) unspecified.
    primary_capability: security.rate_policy
    related_capabilities:
      - security.ratelimit
    confidence: low
