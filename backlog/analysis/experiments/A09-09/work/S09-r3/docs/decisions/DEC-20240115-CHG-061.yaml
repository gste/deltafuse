## Context
CHG-061 requests IPv6 support for `security.ip_filter`. The request duplicates
CHG-042 (rejected, blocked on INFRA-789), overlaps a superseded CHG-055
(superseded by CHG-060 CIDR rewrite), and cannot be reproduced because the
IPv6 test stand is disabled.

## Decision (requested)
Classify CHG-061 as one of:
- duplicate (of CHG-042),
- superseded (by CHG-060),
- not-reproduced, or
- deferred until INFRA-789 completes.

## Open question
Does CHG-060's CIDR rewrite already satisfy the IPv6 requirement, or should a
new minimal IPv6 change be opened after INFRA-789?
