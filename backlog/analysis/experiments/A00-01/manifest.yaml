commands:
  - command: "git rev-parse HEAD; git rev-parse HEAD^; git branch --show-current"
    exit_codes: [0, 0, 0]
    output: "git-snapshot.json:head,parent,branch"
  - command: "git status --porcelain=v1 --untracked-files=all; git diff --cached --name-status; git diff --name-status; git ls-files --others --exclude-standard"
    exit_codes: [0, 0, 0, 0]
    output: "git-snapshot.json:status_porcelain,staged,unstaged,untracked"
  - command: "git diff-tree --no-commit-id --name-only -r HEAD"
    exit_code: 0
    output: "git-snapshot.json:preparation_commit_paths"
  - command: "git diff --name-status HEAD^ HEAD -- <framework paths>"
    exit_code: 0
    arguments_source: "git-snapshot.json:framework_objects[*].path"
    output: "git-snapshot.json:preparation_commit_framework_diff"
  - command: "git diff --name-status 8af3e4dfaac62e9a65674dee49224a5f5a2381a0 60ea40438b0142797848356c660ab88286565e7d -- . ':(exclude)backlog/**'"
    exit_code: 0
    output_lines: []
  - command: "git rev-parse <audit-revision>:<framework-path>"
    exit_code_each: 0
    output: "git-snapshot.json:framework_objects"
  - command: "Get-FileHash -Algorithm SHA256 -LiteralPath <input-or-legacy-log>"
    exit_code: 0
    output: "git-snapshot.json:inputs,legacy_log_inventory"
  - command: "git check-ignore -v -- backlog/analysis/experiments/EX-001/head.log"
    exit_code: 0
    output: ".gitignore:14:*.log"
  - command: "Test-Path for supporting EX-001 artifacts; per-file regex extraction of test counts"
    exit_code: 0
    output: "legacy-review.json"
  - command: "$PSVersionTable.PSVersion.ToString()"
    exit_code: 0
    output: "7.6.5"
command_environment:
  note: "Git commands used a per-command safe.directory equal to the current repository root, normalized to forward slashes. No global Git setting changed. Above commands omit that machine-local prefix."
failed_attempts:
  - operation: "Initial git rev-parse HEAD with a non-normalized backslash safe.directory value"
