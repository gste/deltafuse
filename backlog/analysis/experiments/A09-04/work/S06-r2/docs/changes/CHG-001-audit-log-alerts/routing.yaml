change: CHG-001-audit-log-alerts
claims:
  CR-001:
    summary: Log contains ratelimiter consume lines with key, tokens, result, balance,
      and timestamp fields.
    primary_capability: ratelimit
    related_capabilities:
    - monitoring
    confidence: high
  CR-002:
    summary: Log contains irrelevant DEBUG internal_gc and WARN network lines plus
      duplicate lines.
    primary_capability: monitoring
    related_capabilities:
    - ratelimit
    confidence: high
  CR-003:
    summary: A monitoring.audit_log subsystem must record each consume event with
      key, tokens, result, and timestamp in a structured append-only log.
    primary_capability: monitoring
    confidence: high
  CR-004:
    summary: The audit log must support size-based rotation, max 10 MB per file.
    primary_capability: monitoring
    confidence: high
  CR-005:
    summary: Over a sliding 60-second window, if the count of rejected requests for
      a single key exceeds a threshold (default 100), an alert event must be generated.
    primary_capability: monitoring
    confidence: medium
  CR-006:
    summary: The alert event must contain key, window_start, window_end, rejection_count,
      and threshold.
    primary_capability: monitoring
    confidence: high
  CR-007:
    summary: Irrelevant log lines (DEBUG internal_gc, WARN network) must not affect
      the alerting/audit logic.
    primary_capability: monitoring
    confidence: high
  CR-008:
    summary: The alerting logic should be derived from the provided log sample; no
      concrete expected outputs are specified.
    primary_capability: monitoring
    related_capabilities:
    - ratelimit
    confidence: low
  CR-009:
    summary: The exact integration point with the existing rate limiter code is not
      specified.
    primary_capability: ratelimit
    related_capabilities:
    - monitoring
    confidence: low
  CR-010:
    summary: Acceptance criteria, test expectations, and the precise alerting API
      are not specified.
    primary_capability: monitoring
    confidence: low
