schema_version: 2
capability: limiter
requirements:
  - id: RQ-001
    title: Limiter initialization
    body: >-
      A limiter can be initialized for a given key with two parameters:
      `capacity` (maximum token capacity) and `refill_rate` (tokens refilled per
      second).
    scenarios:
      - id: SC-001
        title: Initialize with positive capacity and refill_rate
        given: >-
          a limiter configured with capacity=10 and refill_rate=1
        when: >-
          the limiter is created for a key
        then: >-
          the key starts with a full bucket of 10 tokens

  - id: RQ-002
    title: Consume when tokens available
    body: >-
      `consume(key, tokens=1)` deducts the requested amount when enough tokens are
      available and returns `True`.
    scenarios:
      - id: SC-002
        title: Consume one token succeeds
        given: >-
          a limiter with capacity=10 and refill_rate=1
        when: >-
          consume(key) is called with 10 tokens available
        then: >-
          the balance decreases by 1 and the result is True

  - id: RQ-003
    title: Consume when tokens insufficient
    body: >-
      `consume(key, tokens=1)` leaves the balance unchanged and returns `False`
      when not enough tokens are available.
    scenarios:
      - id: SC-003
        title: Consume exceeds balance
        given: >-
          a limiter with 2 tokens available
        when: >-
          consume(key, 5) is called
        then: >-
          the balance stays at 2 and the result is False

  - id: RQ-004
    title: Proportional time-based refill
    body: >-
      Elapsed time is accounted for correctly: tokens refill proportionally to
      the time elapsed between calls, but never exceed `capacity`.
    scenarios:
      - id: SC-004
        title: Refill proportional to elapsed time
        given: >-
          a limiter with capacity=10 and refill_rate=1
        when: >-
          5 seconds elapse and consume(key) is called
        then: >-
          up to 5 tokens have refilled and the balance does not exceed 10

  - id: RQ-005
    title: Strict argument validation
    body: >-
      Negative or zero `capacity` / `refill_rate`, and a `consume` call with
      `tokens <= 0`, must raise `ValueError`.
    scenarios:
      - id: SC-005
        title: Reject non-positive capacity
        given: >-
          a limiter being initialized
        when: >-
          capacity=0 is supplied
        then: >-
          a ValueError is raised
      - id: SC-006
        title: Reject non-positive refill_rate
        given: >-
          a limiter being initialized
        when: >-
          refill_rate=-1 is supplied
        then: >-
          a ValueError is raised
      - id: SC-007
        title: Reject non-positive consume amount
        given: >-
          a limiter with tokens available
        when: >-
          consume(key, 0) is called
        then: >-
          a ValueError is raised and the balance is unchanged
