    threshold: "0 type checker errors/critical linter warnings, 100% type annotations on public signatures"
  - id: CODE-006
    name: "Эксплицитность обработки ошибок (Explicit Error Handling)"
    threshold: "0 silent failures / bare excepts, 100% failure paths raise documented typed errors"
  - id: CODE-007
    name: "Сопровождаемость и модульность (Maintainability & Structural Quality)"
    threshold: "Cyclomatic complexity <= 10 per function, 0 cyclical module imports, average function length <= 50 lines"
