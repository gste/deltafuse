case_id: S08c
intent_claims:
  - id: CR-001
    title: "Deploy Config Update"
    description: "Update hostname, port, and log path in deploy configuration."
    normative_rules:
      - "MUST update hostname to limiter-prod-02"
      - "MUST update port to 9090"
      - "MUST update log path to /opt/logs/ratelimiter/"
  - id: CR-002
    title: "Health Check URL Update"
    description: "Update monitoring health check endpoint."
    normative_rules:
      - "MUST update health check URL in monitoring config"
  - id: CR-003
    title: "Runbook Update"
    description: "Update ops runbook with new service coordinates."
    normative_rules:
      - "MUST update docs/ops/runbook.md"

ambiguity_expected: false
expected_decision_needed: false
code_change_expected: false
spec_change_expected: false

routing_validation:
  route_type: operational
  must_not_modify_code: true
  must_not_modify_spec: true
  must_not_modify_tests: true

acceptance_criteria:
  ops_files:
    - "deploy/config.yaml"
    - "monitoring/health_checks.yaml"
    - "docs/ops/runbook.md"
  code_files_unchanged: true
  spec_files_unchanged: true
  test_files_unchanged: true
