case_id: S06
intent_claims:
  - id: CR-001
    title: "Structured Audit Log"
    description: "Append-only structured log of consume events with rotation."
    normative_rules:
      - "MUST log key, tokens, result, timestamp for each consume"
      - "MUST support file rotation at 10 MB"
      - "MUST be append-only"
  - id: CR-002
    title: "Sliding Window Alert"
    description: "Generate alert when rejections exceed threshold in 60s window."
    normative_rules:
      - "MUST detect rejection count exceeding threshold per key per 60s window"
      - "MUST include key, window_start, window_end, rejection_count, threshold"
  - id: CR-003
    title: "Noise Filtering"
    description: "Irrelevant log lines must not affect intake claim extraction."
    normative_rules:
      - "MUST NOT extract claims from DEBUG internal_gc or WARN network lines"
      - "MUST cover all substantive claims despite noise and duplicates"

ambiguity_expected: false
expected_decision_needed: false

acceptance_criteria:
  spec_files:
    - "docs/spec/monitoring/audit_log.md"
    - "docs/spec/_capabilities.yaml"
  code_files:
    - "src/ratelimit/audit.py"
    - "src/ratelimit/alerts.py"
  test_files:
    - "tests/test_audit.py"
    - "tests/test_alerts.py"
  intake_validation:
    - "All 3 substantive claims extracted despite ~35% noise"
    - "No phantom claims from DEBUG/WARN lines"
