case_id: S11
intent_claims:
  - id: CR-001
    title: "Window stats query"
    description: "CHG-B: get_window_stats(key) returns accepted, rejected, remaining_tokens."
    change: CHG-B
    normative_rules:
      - "MUST return accepted, rejected, remaining_tokens"
      - "MUST NOT consume tokens when querying stats"
      - "MUST reset counters with the existing refill window"
  - id: CR-002
    title: "Burst allowance (peer change)"
    description: "CHG-A: optional burst_allowance extra tokens on first reject in a window."
    change: CHG-A
    normative_rules:
      - "MUST default burst_allowance to 0"
      - "MUST preserve existing consume behavior when burst_allowance is 0"
  - id: CR-003
    title: "Delete burst after landing"
    description: "CHG-C: remove burst_allowance from spec, code, tests, and catalog."
    change: CHG-C
    phase: deletion
    normative_rules:
      - "MUST remove burst_allowance from public API"
      - "MUST update docs/spec/security/ratelimit.md"
      - "MUST leave no dangling spec anchors or catalog entries"

ambiguity_expected: false
expected_decision_needed: false

process_oracle:
  concurrent_baseline: "CHG-A and CHG-B start from the same revision"
  after_merge_of_a_into_b:
    stale_green_must_not_pass: true
    evidence_must_be_invalidated_or_rerun: true
    spec_must_reflect_merged_burst_and_stats_claims: true
  after_deletion:
    burst_absent_from_spec: true
    burst_absent_from_code: true
    burst_absent_from_tests: true
    no_dangling_refs: true
  related_findings:
    - F-006

acceptance_criteria:
  spec_files:
    - "docs/spec/security/ratelimit.md"
    - "docs/spec/_capabilities.yaml"
  code_files:
    - "src/ratelimit/limiter.py"
  test_files:
    - "tests/test_limiter.py"
  forbidden_after_deletion:
    - "burst_allowance"
size_ladder_base:
  concurrent_changes: 2
  shared_spec_files: 1
