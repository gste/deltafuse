case_id: S03
intent_claims:
  - id: CR-001
    title: "Fractional Token Refill Accumulation"
    description: "Prevent precision loss by preserving floating point token balances."
    normative_rules:
      - "MUST preserve fractional tokens across successive consume calls"
      - "MUST NOT truncate elapsed * refill_rate to integer"
  - id: CR-002
    title: "Spec Invariance Guarantee"
    description: "Existing specification is already correct; spec diff MUST be empty."
    normative_rules:
      - "MUST NOT modify docs/spec/security/ratelimit.md"
      - "MUST identify bug category in routing"

ambiguity_expected: false
expected_decision_needed: false

