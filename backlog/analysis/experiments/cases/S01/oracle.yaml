case_id: S01
intent_claims:
  - id: CR-001
    title: "Token Bucket Initialization"
    description: "Initialize limiter with capacity and refill_rate per key."
    normative_rules:
      - "MUST accept positive capacity and refill_rate"
      - "MUST raise ValueError for non-positive parameters"
  - id: CR-002
    title: "Token Consumption Logic"
    description: "Consume tokens if available without exceeding capacity."
    normative_rules:
      - "MUST return True and deduct tokens if balance >= tokens"
      - "MUST return False and keep balance intact if balance < tokens"
      - "MUST raise ValueError if requested tokens <= 0"
  - id: CR-003
    title: "Time-based Refill"
    description: "Refill tokens smoothly based on elapsed time."
    normative_rules:
      - "MUST add elapsed_seconds * refill_rate tokens on access"
      - "MUST NOT exceed capacity"

ambiguity_expected: false
expected_decision_needed: false

acceptance_criteria:
  spec_files:
    - "docs/spec/security/ratelimit.md"
    - "docs/spec/_capabilities.yaml"
  code_files:
    - "src/ratelimit/limiter.py"
  test_files:
    - "tests/test_limiter.py"
