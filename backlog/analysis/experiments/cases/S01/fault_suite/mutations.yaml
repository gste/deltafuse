mutations:
  - id: M1_ALLOW_ZERO_CAPACITY
    description: "Invert validation: allows capacity <= 0 without raising ValueError"
    expected_caught_by: test_invalid_parameters
  - id: M2_DEDUCT_ON_FAILURE
    description: "Deducts tokens even when balance < requested tokens"
    expected_caught_by: test_initialization_and_consumption
  - id: M3_NO_CAPACITY_CEILING
    description: "Refill allows tokens to accumulate above capacity"
    expected_caught_by: test_time_refill
  - id: M4_CONSUME_ZERO_TOKENS
    description: "Allows consume(key, tokens=0) without raising ValueError"
    expected_caught_by: test_invalid_parameters
