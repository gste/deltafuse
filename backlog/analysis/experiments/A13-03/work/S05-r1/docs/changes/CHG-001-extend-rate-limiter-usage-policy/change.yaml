schema_version: 2
id: CHG-001-extend-rate-limiter-usage-policy
title: Extend Rate Limiter with usage stats capability and rate policy
description: >
  Add a new capability monitoring.usage_stats exposing per-key usage statistics
  via get_stats(key), and a new policy security.rate_policy that auto-blocks a
  key after a configurable run of consecutive denied consumes. Both changes
  must be mutually compatible: stats must reflect denials caused by both token
  exhaustion and policy-based blocking. Integration tests required.
