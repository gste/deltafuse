change: CHG-001-ratelimit-cooldown
claims:
  O1:
    summary: >-
      Rate Limiter (security.ratelimit) exposes a TokenBucketLimiter whose
      consume returns False when tokens are insufficient.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  O2:
    summary: >-
      TokenBucketLimiter is initialized without any penalty/cooldown parameter
      today.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  E1:
    summary: >-
      TokenBucketLimiter MUST accept an optional penalty_seconds parameter
      defaulting to 0.0.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  E2:
    summary: >-
      When penalty_seconds > 0, a failed consume (insufficient tokens) MUST
      transition the key into a locked state for penalty_seconds.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  E3:
    summary: >-
      While a key is locked, any consume call within the penalty window MUST
      return False immediately, even if tokens have accumulated.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  E4:
    summary: >-
      After penalty_seconds elapses, the lock MUST be released automatically on
      the next request and normal consumption logic MUST resume.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  E5:
    summary: >-
      A method is_blocked(key) MUST return True when the key is currently under
      penalty and False otherwise.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: medium
  C1:
    summary: >-
      Backward compatibility MUST be preserved: existing callers that do not pass
      penalty_seconds MUST behave exactly as before.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  H1:
    summary: >-
      The cooldown state can be modeled as a per-key lock timestamp that is
      lazily evaluated on the next consume/is_blocked call.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: medium
  U1:
    summary: >-
      Exact language/runtime and public API surface of TokenBucketLimiter are
      not yet confirmed (product code not read during intake).
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: low
  U2:
    summary: >-
      Whether is_blocked is a new public API or an internal helper is not
      specified.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: low
  U3:
    summary: >-
      Interaction between cooldown lock and concurrent token accrual is not
      fully specified.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: low
