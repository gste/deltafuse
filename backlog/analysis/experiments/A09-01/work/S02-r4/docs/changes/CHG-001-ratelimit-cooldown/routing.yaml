change: CHG-001-ratelimit-cooldown
claims:
  CR-001:
    summary: >-
      TokenBucketLimiter initialization accepts an optional penalty_seconds
      parameter defaulting to 0.0.
    primary_capability: ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-002:
    summary: >-
      When penalty_seconds > 0, a failed consume (insufficient tokens)
      transitions the key into a blocked state lasting penalty_seconds.
    primary_capability: ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-003:
    summary: >-
      While a key is blocked within the penalty window, any consume call for
      that key MUST return False immediately even if tokens accumulated.
    primary_capability: ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-004:
    summary: >-
      After penalty_seconds elapses, the block is lifted on the next request
      and normal token-spending logic resumes.
    primary_capability: ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-005:
    summary: >-
      is_blocked(key) MUST return True when the key is under penalty and
      False otherwise.
    primary_capability: ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-006:
    summary: >-
      Backward compatibility preserved: existing callers not passing
      penalty_seconds continue under previous rules.
    primary_capability: ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-007:
    summary: >-
      Unknowns: penalty window boundary semantics (inclusive vs exclusive),
      block timer start point, and interaction with concurrent/interleaved
      consume calls.
    primary_capability: ratelimit
    related_capabilities: []
    policies: []
    confidence: low
