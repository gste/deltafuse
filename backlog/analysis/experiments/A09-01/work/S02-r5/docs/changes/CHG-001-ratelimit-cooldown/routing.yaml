change: CHG-001-ratelimit-cooldown
claims:
  CR-001:
    summary: Observation that TokenBucketLimiter lives in the security.ratelimit service;
      not yet verified against product code.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: low
  CR-002:
    summary: TokenBucketLimiter initialization accepts an optional penalty_seconds
      parameter defaulting to 0.0.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-003:
    summary: When penalty_seconds > 0, a failed consume places the key into a blocked
      state lasting penalty_seconds.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-004:
    summary: While a key is blocked, every consume call returns False immediately
      even if tokens have accumulated.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-005:
    summary: After penalty_seconds elapses, the block is lifted automatically on the
      next request and normal consumption resumes.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-006:
    summary: is_blocked(key) returns True when the key is currently under penalty
      and False otherwise.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-007:
    summary: 'Backward compatibility must be preserved: existing callers without penalty_seconds
      keep the previous behavior.'
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-008:
    summary: Hypothesis that the exact semantics of blocked vs normal insufficient
      tokens and interaction with token accrual need confirmation against the existing
      implementation.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: low
  CR-009:
    summary: Unknown concrete language, per-key state storage, and clock source used
      by the service; product code not yet read.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: unknown
