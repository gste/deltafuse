schema_version: 2
domains:
  security:
    summary: Security controls
    capabilities:
      ratelimit:
        summary: Token-bucket rate limiter
        spec:
        - docs/spec/security/ratelimit.md
        code_roots:
        - src/ratelimit
        test_roots:
        - tests
        status: active
        type: supporting
    policies:
      rate_policy:
        summary: Auto-block a key after a consecutive-decline threshold is exceeded
        spec:
        - docs/spec/security/ratelimit.md
        status: active
        type: enforcing
  monitoring:
    summary: Usage and observability
    capabilities:
      usage_stats:
        summary: Per-key usage statistics for the rate limiter
        spec:
        - docs/spec/security/ratelimit.md
        status: active
        type: supporting
