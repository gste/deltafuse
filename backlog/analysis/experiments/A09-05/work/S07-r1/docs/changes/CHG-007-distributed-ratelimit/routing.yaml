    primary_capability: infra.distributed_ratelimit
    related_capabilities:
      - security.ratelimit
    policies: []
    confidence: high
  CR-003:
    summary: Operations must be atomic via Lua scripts in Redis for consistency.
    primary_capability: infra.distributed_ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-004:
    summary: >-
      Configuration must allow switching between in-memory and distributed
      backends through infra.config_reload.
    primary_capability: infra.distributed_ratelimit
    related_capabilities:
      - infra.config_reload
    policies: []
    confidence: medium
  CR-005:
    summary: Redis key TTL must equal capacity / refill_rate * 2 seconds.
    primary_capability: infra.distributed_ratelimit
    related_capabilities: []
    policies: []
    confidence: medium
  CR-006:
    summary: >-
      Graceful degradation: when Redis is unavailable, fall back to in-memory
