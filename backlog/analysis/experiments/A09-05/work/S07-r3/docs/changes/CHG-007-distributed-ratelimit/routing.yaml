change: CHG-007-distributed-ratelimit
claims:
  CR-001:
    summary: |
      Catalog currently lists 15 capabilities including security.ratelimit,
      infra.config_reload, and monitoring.health_check. Factual observation
      establishing the baseline for the change.
    primary_capability: infra.distributed_ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-002:
    summary: |
      New capability infra.distributed_ratelimit must be added, supporting
      init/consume/get_stats like security.ratelimit but persisting state in
      Redis. Core capability-creation expectation.
    primary_capability: infra.distributed_ratelimit
    related_capabilities:
      - security.ratelimit
    policies: []
    confidence: high
  CR-003:
    summary: |
      State operations must be atomic via Lua scripts in Redis for consistency
      under concurrent multi-instance access. Design constraint on the new
      capability.
    primary_capability: infra.distributed_ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-004:
    summary: |
      Switching between in-memory and distributed backends must be configurable
      through infra.config_reload. Defines a dependency on an existing
      capability.
    primary_capability: infra.distributed_ratelimit
    related_capabilities:
      - infra.config_reload
    policies: []
    confidence: high
  CR-005:
    summary: |
      Redis key TTL must equal capacity / refill_rate * 2 seconds. Concrete
      behavioral requirement of the new capability.
    primary_capability: infra.distributed_ratelimit
    related_capabilities: []
    policies: []
    confidence: medium
  CR-006:
    summary: |
      On Redis unavailability the limiter must gracefully degrade to
      in-memory operation and log a warning. Resilience requirement.
    primary_capability: infra.distributed_ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-007:
    summary: |
      A health check endpoint must be exposed via monitoring.health_check to
      verify Redis connectivity. Defines a dependency on an existing
      capability.
    primary_capability: infra.distributed_ratelimit
    related_capabilities:
      - monitoring.health_check
    policies: []
    confidence: high
  CR-008:
    summary: |
      Requester's size estimate (~500 LOC, 3 spec files, separate integration
      test suite). Hypothesis only, not a requirement.
    primary_capability: infra.distributed_ratelimit
    related_capabilities: []
    policies: []
    confidence: low
  CR-009:
    summary: |
      Explicitly asserts no acceptance criteria, design, routing, or spec
      references yet; to be determined in later phases.
    primary_capability: infra.distributed_ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-010:
    summary: |
      Semantics of capacity and refill_rate used in the TTL formula are
      undefined in the source and remain unknown.
    primary_capability: infra.distributed_ratelimit
    related_capabilities: []
    policies: []
    confidence: low
