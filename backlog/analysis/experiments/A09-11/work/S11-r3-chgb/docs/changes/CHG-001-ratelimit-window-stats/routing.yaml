change: CHG-001-ratelimit-window-stats
claims:
  CR-001:
    summary: >-
      security.ratelimit exposes token replenishment logic that resets window
      counters but has no public method to read per-key window statistics.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-002:
    summary: >-
      get_window_stats(key) must return a dict with exactly the fields accepted,
      rejected, and remaining_tokens for the requested key.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-003:
    summary: >-
      Window counters used by get_window_stats are reset together with the
      existing token replenishment logic; no separate reset path.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-004:
    summary: >-
      Calling get_window_stats must not consume tokens and must not change any
      limits.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: high
  CR-005:
    summary: >-
      For an unknown key, get_window_stats returns zero counters (accepted=0,
      rejected=0) and the current remaining_tokens following key-initialization
      rules.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: medium
  CR-006:
    summary: >-
      The remainder for an unknown key is derived from the same key-initialization
      rules used when a key is first seen; formula must be confirmed against the
      existing implementation.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: medium
  CR-007:
    summary: >-
      The exact return type contract and whether remaining_tokens for an unknown
      key reflects a freshly initialized key state need confirmation.
    primary_capability: security.ratelimit
    related_capabilities: []
    policies: []
    confidence: low
