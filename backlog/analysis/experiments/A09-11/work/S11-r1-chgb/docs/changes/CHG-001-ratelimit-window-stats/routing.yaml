change: CHG-001-ratelimit-window-stats
claims:
  CR-001:
    summary: Existing rate limiter lacks a documented method to read per-key window statistics.
    primary_capability: security.ratelimit
    confidence: high
  CR-002:
    summary: get_window_stats(key) returns a dict with exactly accepted, rejected, remaining_tokens.
    primary_capability: security.ratelimit
    confidence: high
  CR-003:
    summary: Window counters reset together with existing token-replenishment logic.
    primary_capability: security.ratelimit
    confidence: medium
  CR-004:
    summary: Reading statistics must not consume tokens or modify limits.
    primary_capability: security.ratelimit
    confidence: high
  CR-005:
    summary: Unknown key returns zero counters and current remainder per key-initialization rules.
    primary_capability: security.ratelimit
    confidence: medium
  CR-006:
    summary: Remainder for unknown key follows existing key-initialization rule; must be confirmed against implementation.
    primary_capability: security.ratelimit
    confidence: low
