$schema: https://json-schema.org/draft/2020-12/schema
$id: https://deltafuse.dev/schemas/v2/capability.schema.yaml
title: DeltaFuse Capability Catalog
type: object
required: [schema_version, domains]
additionalProperties: false
properties:
  schema_version:
    const: 2
  domains:
    type: object
    additionalProperties:
      type: object
      required: [summary, capabilities]
      properties:
        summary: {type: string}
        capabilities:
          type: object
          additionalProperties:
            type: object
            required: [summary, spec]
            properties:
              summary: {type: string}
              spec:
                type: array
                minItems: 1
                items: {type: string}
              policies:
                type: array
                items: {type: string}
              code_roots:
                type: array
                items: {type: string}
              test_roots:
                type: array
                items: {type: string}
              depends_on:
                type: array
                items: {type: string}
