schema_version: 2

framework:
  source: deltafuse
  version: 2.0.0

paths:
  intake: docs/intake
  changes: docs/changes
  specification: docs/spec
  decisions: docs/decisions
  archive: docs/archive

context:
  max_tokens: 16000
  max_files: 24

project:
  baseline: draft
  capability_catalog: docs/spec/_capabilities.yaml

adapters:
  roots:
    - .agents/skills
    - .cursor/skills
    - .gemini/skills
