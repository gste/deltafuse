$schema: https://json-schema.org/draft/2020-12/schema
$id: https://deltafuse.dev/schemas/v3/task.schema.yaml
title: DeltaFuse Task frontmatter
description: "Change-nested artifact (V3-FIX-013): it inherits the schema_version of its parent Change artifact and is validated fail-closed through the Change contract; it carries no schema_version of its own."
type: object
additionalProperties: false
required: [id, change, slice, kind, status, depends_on, requirement_delta, spec_refs, allowed_paths, forbidden_paths, context_budget]
properties:
  id: {type: string, pattern: '^TASK-[0-9]{3,}$'}
  change: {type: string, pattern: '^CHG-[0-9]{3,}(-[a-z0-9-]+)?$'}
  slice: {type: string, pattern: '^SLICE-[0-9]{2,}$'}
  kind: {enum: [feature, bugfix, refactor, maintenance, documentation]}
  status: {enum: [pending, declaring, declared, implementing, implemented, verified, blocked, cancelled, superseded]}
  depends_on:
    type: array
    items: {type: string, pattern: '^TASK-[0-9]{3,}$'}
  requirement_delta: {enum: [none, added, modified, removed, mixed]}
  spec_refs:
    type: array
    minItems: 1
    items: {type: string}
  design_ref:
    type: [string, 'null']
  allowed_paths:
    type: array
    items: {type: string}
  forbidden_paths:
    type: array
    items: {type: string}
  context_budget:
    type: object
    required: [max_tokens, max_files]
    additionalProperties: false
    properties:
      max_tokens:
        type: integer
        minimum: 1
      max_files:
        type: integer
        minimum: 1

