$schema: https://json-schema.org/draft/2020-12/schema
$id: https://deltafuse.dev/schemas/v3/evidence.schema.yaml
title: DeltaFuse Test Evidence
type: object
additionalProperties: false
required: [schema_version, change, phase, timestamp, command, exit_code, result, summary]
properties:
  schema_version: {const: 3}
  change: {type: string, pattern: '^CHG-[0-9]{3,}(-[a-z0-9-]+)?$'}
  task: {type: [string, 'null'], pattern: '^TASK-[0-9]{3,}$'}
  phase: {enum: [red, green, regression, verification]}
  timestamp: {type: string, format: date-time}
  command: {type: string}
  exit_code: {type: integer}
  result: {enum: [expected-failure, passed, failed, blocked, not-reproduced, already-green]}
  failure_category: {type: [string, 'null']}
  summary: {type: string}
  changed_paths:
    type: array
    items: {type: string}
  spec_status: {enum: [unchanged, changed, not-applicable]}
  tests:
    type: object
    additionalProperties: false
    description: >
      What the runner itself reported, read from its JUnit XML (pytest is
      asked for one; Maven and Gradle write theirs anyway). `failed` means a
      test ran and did not pass, `not_run` that collection, compilation or a
      fixture kept it from running - the distinction the two ecosystems spell
      differently and the Red rule is written in.
    properties:
      source: {enum: [junitxml, surefire]}
      failed: {type: array, items: {type: string}}
      passed: {type: array, items: {type: string}}
      not_run: {type: array, items: {type: string}}
      skipped: {type: array, items: {type: string}}
  ownership:
    type: object
    description: >
      Verification only (q4 decision D): code paths the Change touched whose
      owning capabilities routing did not name (unrouted), paths no capability
      owns (unowned), and how blind the check is on this catalog (resolution).
    properties:
      unrouted: {type: object}
      unowned: {type: array, items: {type: string}}
      resolution: {type: [number, 'null']}
      measurable: {type: boolean}
      reason: {type: string}
  base_revision:
    type: string
    pattern: '^sha256:[a-fA-F0-9]{64}$'
    description: Content hash of docs/spec/** and src/** when the evidence was recorded.
  red_oracle:
    type: string
    pattern: '^sha256:[a-fA-F0-9]{64}$'
    description: >
      Red only: content hash of the test files this Red declared, as sorted
      `path:sha256` pairs. The declared oracle is frozen - Implement may add
      tests but must not change the one Red was taken against. The implemented
      gate recomputes it and refuses a difference. Absent on records written
      before the field existed and when Declare listed no test file. Since the
      per-test freeze (`red_oracle_tests`) the Core writes it only for a Red
      without a runner report naming failed tests, where it cannot tell which
      tests are the oracle; a record carries one of the two, never both.
  red_oracle_tests:
    type: object
    additionalProperties: false
    required: [tests, files]
    description: >
      Red only, when the runner's report names failed tests: the declared
      oracle frozen per test instead of per file (core/oracle.py). `tests`
      holds each Python test Red saw fail, with two digests over its normalised
      AST (no positions, comments or docstrings): `body` - the definition with
      its decorators; `context` - what it reaches in the declared test files
      (its class, the fixtures, helpers and imported names it refers to,
      transitively, and the module-level code pytest applies without naming it:
      pytestmark, pytest_plugins, hooks, autouse fixtures, statements binding
      no name). `files` holds what cannot be split into tests, frozen whole:
      `bytes` for non-Python files (JVM tests, data) and Python that did not
      parse, `ast` for a declared Python module with no tests of its own
      (conftest.py, helpers) or a test Red named that the Core could not find.
      New tests and unrelated code in the same file are not frozen. The
      Green evidence call and the implemented gate recompute every entry and
      name the one that moved.
    properties:
      tests:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [path, test, body, context]
          properties:
            path: {type: string}
            test: {type: string, description: "Name inside the file, `Class::method` for a method."}
            body: {type: string, pattern: '^sha256:[a-fA-F0-9]{64}$'}
            context: {type: string, pattern: '^sha256:[a-fA-F0-9]{64}$'}
      files:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [path, form, sha256]
          properties:
            path: {type: string}
            form: {enum: [bytes, ast]}
            sha256:
              type: [string, 'null']
              pattern: '^sha256:[a-fA-F0-9]{64}$'
              description: Null when the file did not exist at Red.
  recorded_by:
    const: deltafuse-evidence
    description: Optional kernel stamp. Gates reject evidence YAML without a matching hash.
  recorded_sha256:
    type: string
    pattern: '^sha256:[a-fA-F0-9]{64}$'
allOf:
  - if:
      properties:
        phase: {enum: [red, green, regression]}
    then:
      required: [task]
      properties:
        task: {type: string, pattern: '^TASK-[0-9]{3,}$'}
  - if:
      properties:
        phase: {const: verification}
    then:
      properties:
        task: {type: 'null'}
  - if:
      properties:
        phase: {enum: [green, regression, verification]}
    then:
      required: [base_revision]
