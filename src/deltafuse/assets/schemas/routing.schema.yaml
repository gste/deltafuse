$schema: https://json-schema.org/draft/2020-12/schema
$id: https://deltafuse.dev/schemas/v3/routing.schema.yaml
title: DeltaFuse Claim Routing
type: object
additionalProperties: true
description: "Change-nested artifact (V3-FIX-013): it inherits the schema_version of its parent Change artifact and carries no schema_version of its own. Unknown top-level keys are ignored. Nested claim objects stay strict."
required: [change, claims]
properties:
  change:
    type: string
    pattern: '^CHG-[0-9]{3,}(-[a-z0-9-]+)?$'
  route:
    enum: [code, docs, ops]
    description: Echo of change.yaml route. Missing means code.
  claims:
    type: object
    propertyNames:
      pattern: '^((CR-[0-9]{3,})|([A-Z]{1,3}[0-9]{1,3}))$'
    additionalProperties:
      type: object
      additionalProperties: false
      required: [primary_capability]
      properties:
        summary:
          type: string
        primary_capability:
          type: string
          minLength: 1
        related_capabilities:
          type: array
          items:
            type: string
        policies:
          type: array
          items:
            type: string
        confidence:
          enum: [low, medium, high, unknown]
