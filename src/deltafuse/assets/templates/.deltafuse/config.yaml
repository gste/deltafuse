schema_version: 3

framework:
  source: deltafuse://v0.0.0 # deltafuse:version-template
  version: 0.0.0 # deltafuse:version-template

paths:
  intake: docs/intake
  changes: docs/changes
  specification: docs/spec
  decisions: docs/decisions
  archive: docs/archive

context:
  max_tokens: 16000
  max_files: 24

workflow:
  call_width: wide
  auto_accept_decisions: false
  leash: "off"

project:
  baseline: draft
  capability_catalog: docs/spec/_capabilities.yaml

adapters:
  mode: auto
  roots:
    - .agents/skills
    - .cursor/skills
    - .gemini/skills
