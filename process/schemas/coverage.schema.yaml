$schema: https://json-schema.org/draft/2020-12/schema
$id: https://deltafuse.dev/schemas/v3/coverage.schema.yaml
title: DeltaFuse Claim Coverage
type: object
additionalProperties: true
description: "Change-nested artifact (V3-FIX-013): it inherits the schema_version of its parent Change artifact and carries no schema_version of its own. Unknown top-level keys are ignored. Nested claim objects stay strict."
required: [change, claims]
properties:
  change:
    type: string
    pattern: '^CHG-[0-9]{3,}(-[a-z0-9-]+)?$'
  task_evidence:
    description: "Per task, what its Red, Green and regression records say as the Core judges them, refreshed at the analyzed, implemented and converged gates. Verify reads this instead of opening every record; a record is opened only when `problems` or a gate error names it."
    type: object
    propertyNames:
      pattern: '^TASK-[0-9]{3,}$'
    additionalProperties:
      type: object
      additionalProperties: false
      required: [status, red, green, regression, problems]
      properties:
        status: {type: string}
        red: {type: string}
        green: {type: string}
        regression: {type: string}
        problems:
          type: array
          items: {type: string}
  claims:
    type: object
    propertyNames:
      pattern: '^((CR-[0-9]{3,})|([A-Z]{1,3}[0-9]{1,3}))$'
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        slice:
          type: string
          pattern: '^SLICE-[0-9]{2,}$'
        tasks:
          type: array
          items:
            type: string
            pattern: '^TASK-[0-9]{3,}$'
        spec_refs:
          type: array
          items:
            type: string
        evidence:
          type: object
          additionalProperties: false
          properties:
            red:
              type: string
            green:
              type: string
            regression:
              type: string
            verification:
              type: string
        status:
          enum: [pending, analyzing, analyzed, specified, decomposed, declaring, declared, implementing, implemented, verified, rejected, not-reproduced]
        tests:
          description: "P12 (workflow.trace_claims: warn): test names whose source names this claim, found in its tasks' Red evidence. Absent or empty is not itself an error - converged only warns."
          type: array
          items:
            type: string
