$schema: https://json-schema.org/draft/2020-12/schema
$id: https://deltafuse.dev/schemas/v2/slice.schema.yaml
title: DeltaFuse Slice frontmatter
type: object
additionalProperties: false
required: [id, change, title, status, primary_capability, claims]
properties:
  id:
    type: string
    pattern: '^SLICE-[0-9]{2,}$'
  change:
    type: string
    pattern: '^CHG-[0-9]{3,}(-[a-z0-9-]+)?$'
  title:
    type: string
    minLength: 1
  status:
    enum: [draft, analyzing, blocked, analyzed, specified, decomposed, verified]
  primary_capability:
    type: string
    minLength: 1
  related_capabilities:
    type: array
    items:
      type: string
  policies:
    type: array
    items:
      type: string
  spec_refs:
    type: array
    items:
      type: string
  claims:
    type: array
    minItems: 1
    items:
      type: string
      pattern: '^CR-[0-9]{3,}$'
  depends_on:
    type: array
    items:
      type: string
      pattern: '^SLICE-[0-9]{2,}$'
  context_budget:
    type: object
    properties:
      max_tokens:
        type: integer
      max_files:
        type: integer
