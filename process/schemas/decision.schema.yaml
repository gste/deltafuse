$schema: https://json-schema.org/draft/2020-12/schema
$id: https://deltafuse.dev/schemas/v3/decision.schema.yaml
title: DeltaFuse Decision Record frontmatter
description: "Change-nested artifact (V3-FIX-013): it inherits the schema_version of its parent Change artifact and is validated fail-closed through the Change contract; it carries no schema_version of its own."
type: object
additionalProperties: false
required: [id, title, kind, status, owner, affects]
properties:
  id: {type: string, pattern: '^DEC-[0-9]{4,}$'}
  title: {type: string, minLength: 1}
  kind: {enum: [product, architecture, integration, policy, operational]}
  status: {enum: [proposed, accepted, rejected, superseded]}
  owner: {type: string, minLength: 1}
  date: {type: string, format: date}
  change:
    anyOf:
      - type: string
        pattern: '^CHG-[0-9]{3,}(-[a-z0-9-]+)?$'
      - type: 'null'
  affects:
    type: object
    required: [capabilities, spec_refs]
    properties:
      capabilities:
        type: array
        items: {type: string}
      spec_refs:
        type: array
        items: {type: string}
  supersedes:
    type: [string, 'null']
  superseded_by:
    type: [string, 'null']
