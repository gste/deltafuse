$schema: https://json-schema.org/draft/2020-12/schema
$id: https://deltafuse.dev/schemas/v2/change.schema.yaml
title: DeltaFuse Change
type: object
additionalProperties: false
required: [schema_version, id, title, status, framework, source, deltas, slices, decisions, tasks]
properties:
  schema_version:
    const: 2
  id:
    pattern: '^CHG-[0-9]{3,}(-[a-z0-9-]+)?$'
  title:
    type: string
    minLength: 1
  status:
    enum: [normalized, analyzing, blocked-on-decision, analyzed, specification-proposed, specified, decomposed, targeting, target-confirmed, implementing, implemented, verifying, converged, archived, rejected, duplicate, not-reproduced, superseded]
  framework:
    type: object
    additionalProperties: false
    required: [version, content_hash]
    properties:
      version: {type: string}
      content_hash: {type: string, pattern: '^sha256:[a-fA-F0-9]{64}$'}
  intent:
    enum: [feature, bugfix, refactor, maintenance, documentation, unknown]
  risk:
    enum: [low, medium, high, critical, unknown]
  source:
    type: object
    required: [request]
    properties:
      request: {type: string}
      intake_refs:
        type: array
        items: {type: string}
  analysis:
    type: object
    properties:
      routing: {type: [string, 'null']}
      summary: {type: [string, 'null']}
  deltas:
    type: array
    items: {$ref: '#/$defs/delta'}
  slices:
    type: array
    items:
      type: object
      required: [id, status, file]
      properties:
        id: {type: string, pattern: '^SLICE-[0-9]{2,}$'}
        status: {enum: [draft, analyzing, blocked, analyzed, specified, decomposed, verified]}
        file: {type: string}
  decisions:
    type: array
    items: {type: string}
  tasks:
    type: array
    items: {type: string}
  verification:
    type: [string, 'null']
$defs:
  operation:
    enum: [none, add, modify, remove, mixed, derive, propose, supersede, record]
  projection:
    type: object
    required: [operation]
    properties:
      operation: {$ref: '#/$defs/operation'}
      refs:
        type: array
        items: {type: string}
  delta:
    type: object
    additionalProperties: false
    required: [id, slice, kind, summary, specification, catalog, decisions, tasks, tests, implementation, evidence]
    properties:
      id: {type: string, pattern: '^DELTA-[0-9]{2,}$'}
      slice: {type: string, pattern: '^SLICE-[0-9]{2,}$'}
      kind: {enum: [requirements, conformance, structural, operational, mixed]}
      summary: {type: string}
      specification: {$ref: '#/$defs/projection'}
      catalog: {$ref: '#/$defs/projection'}
      decisions: {$ref: '#/$defs/projection'}
      tasks: {$ref: '#/$defs/projection'}
      tests: {$ref: '#/$defs/projection'}
      implementation: {$ref: '#/$defs/projection'}
      evidence: {$ref: '#/$defs/projection'}
