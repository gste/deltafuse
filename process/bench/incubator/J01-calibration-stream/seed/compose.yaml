services:
  postgres:
    image: postgres:16.8
    environment:
      POSTGRES_DB: calibration
      POSTGRES_USER: calibration
      POSTGRES_PASSWORD: calibration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calibration -d calibration"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports: ["5432:5432"]

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports: ["9092:9092"]

  telemetry-gateway:
    build:
      context: .
      dockerfile: telemetry-gateway/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["8081:8081"]

  calibration-service:
    build:
      context: .
      dockerfile: calibration-service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JDBC_URL: jdbc:postgresql://postgres:5432/calibration
      JDBC_USER: calibration
      JDBC_PASSWORD: calibration
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports: ["8082:8082"]
