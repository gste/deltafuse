schema_version: 3
domains:
  document:
    summary: Document authoring with immutable versioning and idempotent submission.
    responsibility: >-
      Owns draft documents, immutable versions and submission commands;
      persists state and outbox records atomically; exposes the canonical
      read-only flow observation.
    capabilities:
      CAP-DOC-CREATE:
        summary: Create a draft document idempotently.
        spec: [docs/spec/contracts/api.md#post-documents]
        type: business
        status: active
        entities: [document]
        events: [j03.document.created]
        code_roots: [document-service]
      CAP-DOC-VERSION:
        summary: Create an immutable version of a draft.
        spec: [docs/spec/contracts/api.md#post-documentsdocument_idversions]
        type: business
        status: active
        entities: [document, version]
        events: [j03.document.version-created]
        code_roots: [document-service]
      CAP-DOC-SUBMIT:
        summary: Submit an immutable version for review.
        spec: [docs/spec/contracts/api.md#post-documentsdocument_idversionsversion_idsubmit]
        type: business
        status: active
        entities: [document, version]
        events: [j03.document.version-submitted]
        code_roots: [document-service]
      CAP-CANONICAL-OBSERVATION:
        summary: Deterministic read-only flow observation with a convergence watermark.
        spec: [docs/spec/contracts/canonical-observation.md]
        type: supporting
        status: active
        entities: [document]
        code_roots: [document-service]
  workflow:
    summary: Single-step review workflow with one assigned approver.
    responsibility: >-
      Owns single-step routes and one-approver decisions with transactional
      inbox deduplication and outbox publication; a route closes exactly once.
    capabilities:
      CAP-WF-SINGLE-STEP-ROUTE:
        summary: Open one single-step route with one assigned approver on submission.
        spec: [docs/spec/contracts/events.md#j03workflowroute-created]
        type: business
        status: active
        entities: [route]
        events: [j03.workflow.route-created]
        code_roots: [workflow-service]
      CAP-WF-SINGLE-STEP-DECISION:
        summary: Apply the one approver approve/reject decision exactly once.
        spec: [docs/spec/contracts/api.md#post-workflowsroute_iddecisions]
        type: business
        status: active
        actors: [approver]
        entities: [route, decision]
        events: [j03.workflow.decision-applied]
        code_roots: [workflow-service]
  audit:
    summary: Append-only audit projection of baseline events.
    responsibility: >-
      Consumes baseline events exactly once per event id, projects a stable
      per-aggregate audit sequence, and never acts as a state authority.
    capabilities:
      CAP-AUDIT-PROJECTION:
        summary: Project baseline events into an append-only, replay-idempotent audit sequence.
        spec: [docs/spec/contracts/events.md#delivery-and-atomicity]
        type: supporting
        status: active
        entities: [audit]
        events: [j03.document.created, j03.document.version-created,
                 j03.document.version-submitted, j03.workflow.route-created,
                 j03.workflow.decision-applied]
        code_roots: [audit-service]
