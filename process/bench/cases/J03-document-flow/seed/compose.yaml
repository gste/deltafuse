name: ${J03_COMPOSE_PROJECT:?set J03_COMPOSE_PROJECT via infra/stack.ps1}
x-service: &service
  restart: "no"
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  cpus: 0.75
  mem_limit: 512m
  networks: [j03_private, j03_frontend]
  labels:
    dev.deltafuse.benchmark: J03
    dev.deltafuse.run: ${J03_RUN_ID:?set J03_RUN_ID via infra/stack.ps1}
x-app-environment: &app_environment
  J03_MESSAGING_ENABLED: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError

services:
  postgres:
    image: postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    restart: "no"
    environment:
      POSTGRES_PASSWORD: ${J03_POSTGRES_PASSWORD:?generated by infra/stack.ps1}
      J03_DOCUMENT_DB_PASSWORD: ${J03_DOCUMENT_DB_PASSWORD:?generated by infra/stack.ps1}
      J03_WORKFLOW_DB_PASSWORD: ${J03_WORKFLOW_DB_PASSWORD:?generated by infra/stack.ps1}
      J03_AUDIT_DB_PASSWORD: ${J03_AUDIT_DB_PASSWORD:?generated by infra/stack.ps1}
      J03_JUDGE_DB_PASSWORD: ${J03_JUDGE_DB_PASSWORD:?generated by infra/stack.ps1}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    networks: [j03_private]
    labels: {dev.deltafuse.benchmark: J03, dev.deltafuse.run: "${J03_RUN_ID}"}
  kafka:
    image: apache/kafka-native@sha256:37edf221890d67f9cfa0f540702b001ce4570157bd7875d35916f1bd670a2eee
    restart: "no"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    networks: [j03_private]
    labels: {dev.deltafuse.benchmark: J03, dev.deltafuse.run: "${J03_RUN_ID}"}
  document-service:
    <<: *service
    build: {context: ., dockerfile: document-service/Dockerfile}
    environment:
      <<: *app_environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/j03_document
      SPRING_DATASOURCE_USERNAME: j03_document_app
      SPRING_DATASOURCE_PASSWORD: ${J03_DOCUMENT_DB_PASSWORD}
      J03_QUERY_WORKFLOW_BASE_URL: http://workflow-service:8080
      J03_QUERY_AUDIT_BASE_URL: http://audit-service:8080
    depends_on: {postgres: {condition: service_healthy}, kafka: {condition: service_healthy}}
    ports: ["127.0.0.1:${J03_DOCUMENT_PORT:-18081}:8080"]
    healthcheck: {test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"], interval: 2s, timeout: 3s, retries: 45}
  workflow-service:
    <<: *service
    build: {context: ., dockerfile: workflow-service/Dockerfile}
    environment:
      <<: *app_environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/j03_workflow
      SPRING_DATASOURCE_USERNAME: j03_workflow_app
      SPRING_DATASOURCE_PASSWORD: ${J03_WORKFLOW_DB_PASSWORD}
    depends_on: {postgres: {condition: service_healthy}, kafka: {condition: service_healthy}}
    ports: ["127.0.0.1:${J03_WORKFLOW_PORT:-18082}:8080"]
    healthcheck: {test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"], interval: 2s, timeout: 3s, retries: 45}
  audit-service:
    <<: *service
    build: {context: ., dockerfile: audit-service/Dockerfile}
    environment:
      <<: *app_environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/j03_audit
      SPRING_DATASOURCE_USERNAME: j03_audit_app
      SPRING_DATASOURCE_PASSWORD: ${J03_AUDIT_DB_PASSWORD}
    depends_on: {postgres: {condition: service_healthy}, kafka: {condition: service_healthy}}
    ports: ["127.0.0.1:${J03_AUDIT_PORT:-18083}:8080"]
    healthcheck: {test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"], interval: 2s, timeout: 3s, retries: 45}

networks:
  j03_private: {internal: true, labels: {dev.deltafuse.run: "${J03_RUN_ID}"}}
  j03_frontend: {labels: {dev.deltafuse.run: "${J03_RUN_ID}"}}
volumes:
  postgres_data: {labels: {dev.deltafuse.run: "${J03_RUN_ID}"}}
