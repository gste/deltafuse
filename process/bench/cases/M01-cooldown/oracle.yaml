# M01-cooldown oracle (never copy into the product tree)

case_id: M01-cooldown
ambiguity_expected: false
expected_decision_needed: false
target_capability: security.ratelimit
min_claims: 3
live_spec: docs/spec/security/ratelimit.md
spec_must_contain:
  - penalty_seconds
hidden_tests:
  - test_backward_compatibility
  - test_penalty_lockout_and_expiration
  - test_keys_isolated
leak_needles:
  - penalty_lockout_and_expiration
  - test_keys_isolated
default_weight: 1
check_weights:
  hidden.suite.test_penalty_lockout_and_expiration: 8
  hidden.suite.test_keys_isolated: 6
  hidden.suite.test_backward_compatibility: 4
  live.spec.penalty_seconds: 3
  code.penalty_seconds: 3
  routing.capability: 2
  slices.capability: 2
score_mix:
  correctness: 0.6
  process: 0.4
code_must_contain:
  - id: code.penalty_seconds
    path: src/ratelimit/limiter.py
    tokens:
      - penalty_seconds
scope:
  allowed_write_after_specify:
    - docs/spec/security/ratelimit.md
    - docs/spec/_capabilities.yaml
    - docs/changes/**/spec-delta.md
  forbidden_until_implement:
    - src/ratelimit/limiter.py
