# Copied once by the DeltaFuse installer. Product-owned: edit freely.
# Runs `deltafuse leash`, then the product's pytest (not the framework suite).
name: DeltaFuse leash

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  leash:
    runs-on: ubuntu-latest
    steps:
      # v5 runs on Node 24; v4 is force-migrated from deprecated Node 20.
      - uses: actions/checkout@v5
        with:
          # DF3-003 / SEC-01: leash diffs an exact base...head SHA range (from the
          # merge base), so the runner needs history to resolve both commits.
          fetch-depth: 0
          submodules: recursive
      # v6 runs on Node 24; the product Python version remains pinned below.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned DeltaFuse
        run: |
          set -e
          # Canonical nested path is vendor/deltafuse. Hyphenated dirs are leftover checkouts.
          if [ -d vendor/deltafuse ]; then
            python -m pip install -e ./vendor/deltafuse
          elif [ -d vendor/deltafuse ]; then
            python -m pip install -e ./vendor/deltafuse
          elif [ -d deltafuse ]; then
            python -m pip install -e ./deltafuse
          elif [ -d deltafuse ]; then
            python -m pip install -e ./deltafuse
          else
            echo "Checkout the framework version pinned in .deltafuse/lock.yaml (submodule or vendor path), then re-run." >&2
            exit 1
          fi
      - name: Leash
        run: |
          # DF3-003 / SEC-01: a clean checkout has no worktree diff; judge what
          # head committed since it left base (base...head, three dots: commits the
          # base branch got later are not the PR's). Untracked files stay checked.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi
          [ -n "$HEAD" ] || HEAD="$(git rev-parse HEAD)"
          git fetch --no-tags origin "$BASE" "$HEAD" 2>/dev/null || true
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # No usable base (the branch is new here, or history was rewritten). A clean checkout
            # has no working-tree diff, so `deltafuse leash .` alone judged nothing and passed.
            # Judge at least what the head commit itself changed, and say that this is all.
            if git rev-parse -q --verify "$HEAD^" >/dev/null 2>&1; then
              BASE="$(git rev-parse "$HEAD^")"
              echo "::warning::DeltaFuse leash: no base commit for this push; only the head commit $HEAD is judged."
            else
              echo "DeltaFuse leash: $HEAD is the first commit of this history; there is nothing to judge it against."
              exit 0
            fi
          fi
          python -m deltafuse leash . --base "$BASE" --head "$HEAD"
      - name: Product tests
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          fi
